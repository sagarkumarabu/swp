<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locker</title>
</head>
<body>
    <style> 
       :root{--font-scale:1;}
       *{margin:0; padding:0;}
        canvas{border: 0.1rem solid black; margin:10px;
       }
        body{background-color: antiquewhite;
            font-size: calc(16px * var(--font-scale));
           
            flex-direction: column;
           
        height: 100vh;}
        input, select, button, table { font-size: calc(14px * var(--font-scale)); }
        .summary { 
            float: right; 
            border: solid 2px;
            height: 400px;
            width: 400px;
            background: #fff;
            padding: 10px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        nav{ background-color: dimgray; min-height:34px; display:flex; align-items:center; gap:2px; padding:0 8px;}
        nav a{color:#fff;text-decoration: none;padding:8px 10px; font-size: calc(14px * var(--font-scale));}
        a:hover{background-color: green;}
        .font-controls{margin-left:auto; display:flex; align-items:center; gap:4px;}
        .font-btn{border:1px solid #8f8f8f; border-radius:4px; background:#f4f4f4; color:#1c1c2e; cursor:pointer; font-weight:700; min-width:34px; padding:4px 8px; line-height:1.1;}
        .font-btn:hover{background:#fff;}
    </style>
    <nav>
        <a href="index.html">Cubicle</a>
        <a href="locker.html">Locker</a>
        <a href="calculate.html">Partition</a>
        <div class="font-controls" aria-label="Font size controls">
            <button type="button" class="font-btn" onclick="changeFontSize(1)" title="Increase font size">A+</button>
            <button type="button" class="font-btn" onclick="changeFontSize(-1)" title="Decrease font size">A-</button>
        </div>
    </nav>
    <form>
        <h3>Locker Configuration</h3>
        <table>
            <tr>
              <td><label for="lh">Height:</label></td>
                <td><input type="number" id="lh" value="1800" min="1000"></td>
            </tr>
            <tr>
                <td><label for="skirting">Skirting (mm):</label></td>
                <td><input type="number" id="skirting" value="60" min="0"></td>
            </tr>
            <tr>
                <td><label for="lw">Width:</label></td>
                <td><input type="number" id="lw" value="1800" min="50"></td>
            </tr>
            <tr>
                <td><label for="lc">Columns:</label></td>
                <td><input type="number" id="lc" value="4" min="1"></td>
            </tr>
            <tr>
                <td><label for="zshape">Z-shape:</label></td>
                <td>
                    <input type="checkbox" id="zshape"> 
                    <label for="zcol">for col (0=All):</label>
                    <input type="number" id="zcol" value="1" min="0" style="width:40px">
                </td>
            </tr>
            <tr>
                <td><label for="lr">Module:</label></td>
                <td>
                    <select name="lr" id="lr">
                        <option value="1">A1</option>
                        <option value="2">A2</option>
                        <option value="3">A3</option>
                        <option value="4">A4</option>
                        <option value="5">A5</option>
                        <option value="6">A6</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="2" style="padding-top: 10px;">
                    <button type="button" onclick="calculate()">Calculate</button>
                </td>
            </tr>
            <tr>
                <td>Color:</td><td><div id="color"></div></td></tr>
        </table>
    </form>
    <table><tr><td>
    <canvas id="cv" width="500" height="400">    </canvas>

    </td>
    <td><div class="summary">
       <h3 style="text-align:center; margin-bottom: 10px;">Summary</h3>
       <table style="width: 100%; border-collapse: collapse; text-align: left;">
           <thead>
               <tr style="background: #f1f1f1;">
                   <th style="border: 1px solid #ccc; padding: 6px;">Item</th>
                   <th style="border: 1px solid #ccc; padding: 6px;">Qty</th>
                   <th style="border: 1px solid #ccc; padding: 6px;">Dimension (W x H)</th>
               </tr>
           </thead>
           <tbody id="summaryBody">
           </tbody>
       </table>
    </div></td></tr></table>
    </div>
    <script src="font-size.js"></script>
    <script>
        let currentColor = '#e9ecef';
        let lockerColors = {};

        function color() {
            let shade = document.getElementById('color');
            shade.style.display = 'flex';
            shade.style.flexWrap = 'wrap';
            shade.style.gap = '4px';
            
            solids.forEach((solid, index) => {
                let swatch = document.createElement('div');
                swatch.style.width = '24px';
                swatch.style.height = '24px';
                swatch.style.backgroundColor = solid.color;
                swatch.style.border = '1px solid #ccc';
                swatch.style.borderRadius = '3px';
                swatch.title = solid.name;
                swatch.style.cursor = 'pointer';

                if (index === 0) {
                    currentColor = solid.color;
                    swatch.style.outline = '2px solid #333';
                    swatch.style.transform = 'scale(1.1)';
                }

                swatch.onclick = () => {
                    Array.from(shade.children).forEach(child => {
                        child.style.outline = 'none';
                        child.style.transform = 'scale(1)';
                    });
                    swatch.style.outline = '2px solid #333';
                    swatch.style.transform = 'scale(1.1)';
                    currentColor = solid.color;
                };
                shade.appendChild(swatch);
            });
        }


        function calculate() {
            var lh = parseFloat(document.getElementById('lh').value);
            var lw = parseFloat(document.getElementById('lw').value);
            var lc = parseInt(document.getElementById('lc').value);
            var lr = parseInt(document.getElementById('lr').value);
            var skirting = parseFloat(document.getElementById('skirting').value) || 0;
            var zshape = document.getElementById('zshape') ? document.getElementById('zshape').checked : false;
            var zcol = document.getElementById('zcol') ? parseInt(document.getElementById('zcol').value) : 1;
            
            var cv = document.getElementById('cv');
            var ctx = cv.getContext('2d');
            ctx.clearRect(0, 0, cv.width, cv.height);
            
            if (lh > 0 && lw > 0 && lc > 0 && lr > 0) {
                var lockerH = Math.max(0, lh - skirting);
                var rh = lockerH / lr;
                var rw = lw / lc;

                // Calculate scale and padding to fit drawing into the canvas
                var padding = 50;
                var scale = Math.min((cv.width - padding * 2) / lw, (cv.height - padding * 2) / lh);

                var startX = (cv.width - (lw * scale)) / 2;
                var startY = (cv.height - (lh * scale)) / 2;

                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;

                for (var c = 0; c < lc; c++) {
                    var x = startX + c * rw * scale;
                    var w = rw * scale;
                    var fullH = lockerH * scale;

                    if (zshape && (zcol === 0 || c === zcol - 1)) {
                        // Draw entire column as a single Z-shape (2 doors)
                        var y = startY;

                        var cutX = x + w / 2;
                        var cutY1 = y + fullH * 0.35;
                        var cutY2 = y + fullH * 0.65;
                        var inset = Math.max(2, 5 * scale);

                        // Top Door
                        ctx.fillStyle = lockerColors[c + '-0'] || '#e9ecef';
                        ctx.beginPath();
                        ctx.moveTo(x, y);
                        ctx.lineTo(x + w, y);
                        ctx.lineTo(x + w, cutY2);
                        ctx.lineTo(cutX, cutY2);
                        ctx.lineTo(cutX, cutY1);
                        ctx.lineTo(x, cutY1);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();

                        // Bottom Door
                        ctx.fillStyle = lockerColors[c + '-1'] || '#e9ecef';
                        ctx.beginPath();
                        ctx.moveTo(x, cutY1);
                        ctx.lineTo(cutX, cutY1);
                        ctx.lineTo(cutX, cutY2);
                        ctx.lineTo(x + w, cutY2);
                        ctx.lineTo(x + w, y + fullH);
                        ctx.lineTo(x, y + fullH);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();

                        // Door 1 Inset
                        ctx.beginPath();
                        ctx.moveTo(x + inset, y + inset);
                        ctx.lineTo(x + w - inset, y + inset);
                        ctx.lineTo(x + w - inset, cutY2 - inset);
                        ctx.lineTo(cutX + inset, cutY2 - inset);
                        ctx.lineTo(cutX + inset, cutY1 - inset);
                        ctx.lineTo(x + inset, cutY1 - inset);
                        ctx.closePath();
                        ctx.stroke();

                        // Door 2 Inset
                        ctx.beginPath();
                        ctx.moveTo(x + inset, cutY1 + inset);
                        ctx.lineTo(cutX - inset, cutY1 + inset);
                        ctx.lineTo(cutX - inset, cutY2 + inset);
                        ctx.lineTo(x + w - inset, cutY2 + inset);
                        ctx.lineTo(x + w - inset, y + fullH - inset);
                        ctx.lineTo(x + inset, y + fullH - inset);
                        ctx.closePath();
                        ctx.stroke();

                        // Draw Lock / Handle for Door 1
                        var knobR = Math.max(3, 4 * scale);
                        var knobX = x + inset + Math.max(6, 15 * scale);
                        var knobY1 = y + fullH * 0.325; 
                        ctx.beginPath();
                        ctx.fillStyle = '#555';
                        ctx.arc(knobX, knobY1, knobR, 0, Math.PI * 2);
                        ctx.fill();

                        // Draw Lock / Handle for Door 2
                        var knobY2 = y + fullH * 0.825;
                        ctx.beginPath();
                        ctx.fillStyle = '#555';
                        ctx.arc(knobX, knobY2, knobR, 0, Math.PI * 2);
                        ctx.fill();

                        // Draw vents Door 1
                        var ventW = Math.min(w / 3, 30 * scale);
                        var ventX = x + w / 2 - ventW / 2;
                        var ventY1 = y + inset + Math.max(5, 15 * scale);
                        ctx.lineWidth = 1;
                        for (var v = 0; v < 4; v++) {
                            ctx.beginPath();
                            ctx.moveTo(ventX, ventY1 + (v * Math.max(3, 8 * scale)));
                            ctx.lineTo(ventX + ventW, ventY1 + (v * Math.max(3, 8 * scale)));
                            ctx.stroke();
                        }

                        // Draw vents Door 2
                        var ventY2 = y + fullH - inset - Math.max(5, 15 * scale) - (3 * Math.max(3, 8 * scale));
                        for (var v = 0; v < 4; v++) {
                            ctx.beginPath();
                            ctx.moveTo(ventX, ventY2 + (v * Math.max(3, 8 * scale)));
                            ctx.lineTo(ventX + ventW, ventY2 + (v * Math.max(3, 8 * scale)));
                            ctx.stroke();
                        }
                        ctx.lineWidth = 2;
                    } else {
                        // Draw multiple rows for this column
                        for (var r = 0; r < lr; r++) {
                            var rowY = startY + r * rh * scale;
                            var h = rh * scale;

                            // Draw locker frame
                            ctx.fillStyle = lockerColors[c + '-' + r] || '#e9ecef';
                            ctx.fillRect(x, rowY, w, h);
                            ctx.strokeRect(x, rowY, w, h);

                            // Draw door inset outline
                            var inset = Math.max(2, 5 * scale);
                            ctx.strokeRect(x + inset, rowY + inset, w - inset * 2, h - inset * 2);

                            // Draw Lock / Handle
                            var knobX = x + inset + Math.max(6, 15 * scale);
                            var knobY = rowY + h / 2;
                            var knobR = Math.max(3, 4 * scale);
                            
                            ctx.beginPath();
                            ctx.fillStyle = '#555';
                            ctx.arc(knobX, knobY, knobR, 0, Math.PI * 2);
                            ctx.fill();
                            
                            // Draw vents at the top of the door
                            var ventW = Math.min(w / 3, 30 * scale);
                            var ventX = x + w / 2 - ventW / 2;
                            var ventY = rowY + inset + Math.max(5, 15 * scale);
                            
                            ctx.lineWidth = 1;
                            for (var v = 0; v < 4; v++) {
                                ctx.beginPath();
                                ctx.moveTo(ventX, ventY + (v * Math.max(3, 8 * scale)));
                                ctx.lineTo(ventX + ventW, ventY + (v * Math.max(3, 8 * scale)));
                                ctx.stroke();
                            }
                            ctx.lineWidth = 2; // Restore stroke width for next locker
                        }
                    }
                }
                
                // Draw skirting
                if (skirting > 0) {
                    ctx.fillStyle = '#4a4e4a';
                    ctx.fillRect(startX, startY + lockerH * scale, lw * scale, skirting * scale);
                    ctx.strokeRect(startX, startY + lockerH * scale, lw * scale, skirting * scale);
                }

                var depth = 450;
                ctx.fillStyle = '#333';
                ctx.font = '14px Roboto, sans-serif';
                ctx.fillText('Overall dimension: ' + lw + 'W x ' + lh + 'H', startX, startY + (lh * scale) + 25);
                ctx.fillText('Locker dimension: ' + 
                rw.toFixed(1) + 'W x ' + rh.toFixed(1) + 
                'H x ' + depth + ' Depth', startX, startY + (lh * scale) + 45);

                // Generate Summary
                var topQty = 1;
                var bottomQty = 1;
                var sidesQty = 2;
                var backboardQty = 1;
                var dividerQty = lc - 1;
                
                var shelfQty = 0;
                var normalDoorsQty = 0;
                var zDoorsQty = 0;
                
                for (var c = 0; c < lc; c++) {
                    var isZ = zshape && (zcol === 0 || c === zcol - 1);
                    if (isZ) {
                        zDoorsQty += 2;
                        shelfQty += 2;
                    } else {
                        shelfQty += Math.max(0, lr - 1);
                        normalDoorsQty += lr;
                    }
                }
                
                var totalDoors = normalDoorsQty + zDoorsQty;
                var summaryHtml = '';
                
                function addSummaryRow(item, qty, dim) {
                    if (qty > 0) {
                        summaryHtml += '<tr>';
                        summaryHtml += '<td style="border: 1px solid #ccc; padding: 6px;">' + item + '</td>';
                        summaryHtml += '<td style="border: 1px solid #ccc; padding: 6px;">' + qty + '</td>';
                        summaryHtml += '<td style="border: 1px solid #ccc; padding: 6px;">' + dim + '</td>';
                        summaryHtml += '</tr>';
                    }
                }
                
                addSummaryRow('Top', topQty, lw.toFixed(1) + ' x ' + depth);
                addSummaryRow('Bottom', bottomQty, lw.toFixed(1) + ' x ' + depth);
                addSummaryRow('Sides', sidesQty, depth + ' x ' + lh.toFixed(1));
                addSummaryRow('Backboard', backboardQty, lw + ' x ' + (lh - skirting));
                addSummaryRow('Divider', dividerQty, depth + ' x ' + lockerH.toFixed(1));
                addSummaryRow('Shelf', shelfQty, rw.toFixed(1) + ' x ' + depth);
                if (normalDoorsQty > 0) addSummaryRow('Shutter', normalDoorsQty, rw.toFixed(1) + ' x ' + rh.toFixed(1));
                if (zDoorsQty > 0) addSummaryRow('Z-Shutter', zDoorsQty, rw.toFixed(1) + ' x ' + (lockerH * 0.65).toFixed(1));
                addSummaryRow('Lock', totalDoors, '-');
                addSummaryRow('Hinges', totalDoors * 3, '-');
                addSummaryRow('U-channel', (totalDoors + 1)*2, '-');
                addSummaryRow('Half-round', (totalDoors +1)*4, '-');
                
                var summaryBody = document.getElementById('summaryBody');
                if (summaryBody) summaryBody.innerHTML = summaryHtml;
            }
        }
          const solids = [
      { id: 'solid1', name: 'Q 13', color: '#fcf8f1', },
      { id: 'solid5', name: 'RC 15', color: '#f7df37' },
      { id: 'solid6', name: 'Q 17', color: '#f9f1e5' },
      { id: 'solid7', name: 'Q 601', color: '#fdfdfd' },
      { id: 'solid8', name: 'Q 603', color: '#232a2d' },
      { id: 'solid9', name: 'RC 605', color: '#582730' },
      { id: 'solid10', name: 'RC 606', color: '#4a4e4a' },
      { id: 'solid11', name: 'RC 617', color: '#9baa72' },
      { id: 'solid12', name: 'RC 720', color: '#ffffff' },
      { id: 'solid13', name: 'Q 801', color: '#8b8d88' },
      { id: 'solid14', name: 'Q 851', color: '#f8f6f4' },
      { id: 'solid4', name: 'RC 853', color: '#1677b9' },
      { id: 'solid15', name: 'Q 855', color: '#f9f0dd' },
      { id: 'solid16', name: 'Q 856', color: '#fefef4' },
      { id: 'solid17', name: 'RC 857', color: '#ec763f' },
      { id: 'solid18', name: 'RC 859', color: '#f4e8d9' },
      { id: 'solid19', name: 'Q 860', color: '#e8e8e6' },
      { id: 'solid20', name: 'Q 861', color: '#a7a59d' },
      { id: 'solid21', name: 'Q 862', color: '#6a665f' },
      { id: 'solid2', name: 'RC 864', color: '#f4a832' },
      { id: 'solid3', name: 'Q 865', color: '#c1cf69' },
      { id: 'solid22', name: 'Q 867', color: '#b1c3d7' },
      { id: 'solid23', name: 'RC 869', color: '#007b3e' },
      { id: 'solid24', name: 'RC 872', color: '#e21a37' },
      { id: 'solid25', name: 'Q 873', color: '#586061' },
      { id: 'solid26', name: 'Q 879', color: '#b7a593' },
      { id: 'solid27', name: 'RC 884', color: '#72adf5' },
      { id: 'solid28', name: 'RC 885', color: '#c3c5be' },
      { id: 'solid29', name: 'Q 886', color: '#e0dad7' },
      { id: 'solid30', name: 'Q 887', color: '#989898' },
      { id: 'solid31', name: 'Q 888', color: '#cbbeb3' },
      { id: 'solid32', name: 'Q 889', color: '#474747' }
    ];

        // Initialize the color palette
        color();

        // Handle canvas clicks to color individual lockers
        document.getElementById('cv').addEventListener('click', function(e) {
            var cv = document.getElementById('cv');
            var rect = cv.getBoundingClientRect();
            var clickX = e.clientX - rect.left;
            var clickY = e.clientY - rect.top;

            var lh = parseFloat(document.getElementById('lh').value);
            var lw = parseFloat(document.getElementById('lw').value);
            var lc = parseInt(document.getElementById('lc').value);
            var lr = parseInt(document.getElementById('lr').value);
            var skirting = parseFloat(document.getElementById('skirting').value) || 0;
            var zshape = document.getElementById('zshape') ? document.getElementById('zshape').checked : false;
            var zcol = document.getElementById('zcol') ? parseInt(document.getElementById('zcol').value) : 1;
            
            var padding = 50;
            var scale = Math.min((cv.width - padding * 2) / lw, (cv.height - padding * 2) / lh);

            var startX = (cv.width - (lw * scale)) / 2;
            var startY = (cv.height - (lh * scale)) / 2;
            var lockerH = Math.max(0, lh - skirting);
            var rh = lockerH / lr;
            var rw = lw / lc;

            if (clickX >= startX && clickX <= startX + (lw * scale) && clickY >= startY && clickY <= startY + (lockerH * scale)) {
                var c = Math.floor((clickX - startX) / (rw * scale));
                var isZ = zshape && (zcol === 0 || c === zcol - 1);
                var r;

                if (isZ) {
                    var cutY1 = startY + (lockerH * scale) * 0.35;
                    var cutY2 = startY + (lockerH * scale) * 0.65;
                    var cutX = startX + c * rw * scale + (rw * scale) / 2;
                    
                    r = clickY < cutY1 ? 0 : (clickY > cutY2 ? 1 : (clickX < cutX ? 1 : 0));
                } else {
                    r = Math.floor((clickY - startY) / (rh * scale));
                }

                lockerColors[c + '-' + r] = currentColor;
                calculate();
            }
        });
    </script>

</body>
</html>
